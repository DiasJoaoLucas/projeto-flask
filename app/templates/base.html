<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ titulo }} · Projeto Flask + Docker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <header class="topbar">
    <nav class="navbar">
      <a class="logo" href="{{ url_for('home') }}">🐳 Projeto-Flask</a>

      <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menu">
        <span></span><span></span><span></span>
      </button>

      <ul class="nav-links" id="nav-links">
        {% for item in menu %}
          <li>
            <a href="{{ item.rota }}" class="{{ 'ativo' if item.endpoint == ativo else '' }}">
              {{ item.nome }}
            </a>
          </li>
        {% endfor %}
      </ul>
    </nav>
  </header>

  <main class="conteudo">
    {% block conteudo %}{% endblock %}
  </main>

  <footer class="rodape">
    <p>Instituto Federal de São Paulo · Campos do Jordão &mdash; {{ 2026 }}</p>
    <p class="status" id="status-servidor">verificando status do servidor...</p>
  </footer>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
