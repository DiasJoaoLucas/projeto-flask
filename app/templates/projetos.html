{% extends "base.html" %}

{% block conteudo %}
<section class="pagina-projetos">
  <h1>Projetos</h1>
  <p>Esta lista vem do backend (variável Python em <code>app.py</code>), não está escrita fixa no HTML.</p>

  <div class="grade-projetos">
    {% for p in projetos %}
      <article class="cartao-projeto">
        <h3>{{ p.nome }}</h3>
        <p>{{ p.descricao }}</p>
        <span class="badge badge-{{ p.status|lower|replace(' ', '-') }}">{{ p.status }}</span>
      </article>
    {% endfor %}
  </div>
</section>
{% endblock %}
